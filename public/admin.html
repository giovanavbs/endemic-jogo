<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM — Anfitrião Caótico</title><link rel="stylesheet" href="/style.css"></head><body><div class="noise"></div><main class="wrap admin-wrap">
<header><div class="eyebrow">// ÁREA RESTRITA //</div><h1>PAINEL<br><span>DO ADM</span></h1></header>
<section id="login" class="panel"><div class="panel-title">ACESSO DO ANFITRIÃO</div><input id="password" type="password" placeholder="SENHA"><button id="loginBtn" class="primary">ENTRAR ↗</button><div id="loginMsg"></div></section>
<section id="dashboard" class="hidden"><div class="admin-actions"><button id="start" class="primary">✦ INICIAR NOVO JOGO</button><button id="finish" class="danger">ENCERRAR RODADA</button><button id="resetRound" class="ghost danger-outline">↶ RESETAR RODADA ATUAL</button><button id="reset" class="ghost danger-outline">↺ RESETAR TUDO</button></div><div class="grid"><section class="panel"><div class="panel-title">RODADA <span id="round">—</span></div><div id="event" class="event-box">Nenhum jogo iniciado.</div></section><section class="panel"><div class="panel-title">JOGADORES <span id="total">0</span>/16</div><div class="stats"><span>MAGISTRADAS <b id="cMag">0/2</b></span><span>INFILTRADOS <b id="cInf">0/4</b></span><span>MASCARADOS <b id="cMas">0/10</b></span></div><div id="players"></div></section><section class="panel"><div class="panel-title">PALPITES DAS MAGISTRADAS</div><div id="magGuesses" class="mag-guess-list">Nenhum palpite registrado.</div></section></div></section>
<footer><a href="/">VOLTAR AO JOGO</a></footer></main><script src="/admin.js"></script></body></html>
