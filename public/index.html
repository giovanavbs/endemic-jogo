<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C40T1C0</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="noise"></div><main class="wrap">
<header><div class="eyebrow">// EVENTO PARANORMAL // RODADA <span id="round">—</span></div><h1>EXTASIMUS<br><span>CAÓTICO</span></h1><p class="sub">Um jogo. Quatro infiltrados. O caos.</p></header>
<section id="lobby" class="panel"><div class="panel-title">ENTRAR NA RODADA</div><div id="offline" class="alert hidden"></div><input id="name" maxlength="32" placeholder="SEU NOME" autocomplete="off"><div class="roles">
<button data-role="magistrada"><b>DEUSAS</b><small>2 vagas</small></button><button data-role="infiltrado"><b>INFILTRADO</b><small>4 vagas</small></button><button data-role="mascarado"><b>MASCARADO</b><small>10 vagas</small></button></div><div id="counts" class="counts">Magistradas 0/2 · Infiltrados 0/4 · Mascarados 0/10</div></section>
<section id="game" class="panel hidden"><div class="panel-title">SEU ACESSO</div><div id="roleBadge" class="role-badge"></div><div id="roleContent"></div><div id="guessBox" class="hidden"><textarea id="guess" placeholder="Escreva o evento que você acha que aconteceu..."></textarea><button id="sendGuess" class="primary">REGISTRAR MEU CHUTE ↗</button><div id="guessStatus"></div></div><div id="magGuessBox" class="hidden"><div class="guess-title">QUEM SÃO OS 4 INFILTRADOS?</div><input class="mag-guess" maxlength="32" placeholder="INFILTRADO 1"><input class="mag-guess" maxlength="32" placeholder="INFILTRADO 2"><input class="mag-guess" maxlength="32" placeholder="INFILTRADO 3"><input class="mag-guess" maxlength="32" placeholder="INFILTRADO 4"><button id="sendMagGuess" class="primary">REGISTRAR PALPITE DAS 4 ↗</button><div id="magGuessStatus"></div></div><button id="leave" class="ghost">Sair desta tela</button></section>
<footer><a href="/admin">PAINEL DO ADM</a><span>◆</span><span>SECRETO</span></footer></main><script src="/app.js"></script></body></html>
